<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DT PRAISE | Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      color: #ddd;
    }

    .gallery {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #ddd;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 20px auto 40px;
      padding: 12px 20px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <header>
    <h1>DT PRAISE</h1>
    <p>Gallery</p>
  </header>

  <section class="gallery">

    <img src="dt-praise.jpg" alt="DT PRAISE">

    <!-- Add more pictures here later -->

  </section>

  <a class="back" href="index.html">← Back to Website</a>

</body>
</html>
