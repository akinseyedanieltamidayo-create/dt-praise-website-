<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | DT PRAISE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 45px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .check {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="check">✓</div>

      <h1>Thank You!</h1>

      <p>
        Your message has been received successfully.
        Thank you for contacting <strong>DT PRAISE</strong>.
      </p>

      <p>
        We appreciate you reaching out and will get back to you as soon as possible.
      </p>

      <a href="index.html" class="button">Back to Home</a>

    </div>
  </div>

</body>
</html>
