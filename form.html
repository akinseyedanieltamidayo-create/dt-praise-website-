<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact DT PRAISE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #111;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Contact DT PRAISE</h1>

    <p class="subtitle">
      Send a message or invite DT PRAISE to your program.
    </p>

    <!-- FORM -->
    <form action="https://formspree.io/f/mrpzdvqa" method="POST">
      <input type="hidden" name="_subject" value="New DT PRAISE Website Form Submission">

      <input type="hidden" name="_captcha" value="false">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="Full Name"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Phone / WhatsApp</label>
      <input
        type="tel"
        id="phone"
        name="Phone / WhatsApp"
        placeholder="Enter your phone number"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="Email"
        placeholder="Enter your email"
        required
      >

      <label for="event">Event / Church Name</label>
      <input
        type="text"
        id="event"
        name="Event / Church Name"
        placeholder="Enter event or church name"
      >

      <label for="date">Event Date</label>
      <input
        type="date"
        id="date"
        name="Event Date"
      >

      <label for="location">Location</label>
      <input
        type="text"
        id="location"
        name="Location"
        placeholder="Where will the event take place?"
      >

      <label for="message">Message</label>
      <textarea
        id="message"
        name="Message"
        placeholder="Write your message here..."
        required
      ></textarea>

      <button type="submit">
        SEND MESSAGE
      </button>

    </form><form action="message-thank-you.html">

    <a class="back" href="index.html">
      ← Back to DT PRAISE
    </a>

  </div>

</body>
</html>
